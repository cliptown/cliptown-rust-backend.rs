name: Rust Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: cliptown_test
          POSTGRES_USER: cliptown
          POSTGRES_PASSWORD: cliptown_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cliptown -d cliptown_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CLIPTOWN_TEST_DATABASE_URL: postgres://cliptown:cliptown_test@127.0.0.1:5432/cliptown_test
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: cliptown-rust-backend.rs
          persist-credentials: false
          show-progress: false
      - name: Check out pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cliptown/cliptown-interfaces
          ref: ef3d5f55719e56b1a6f11d2d6464c0976aa1863d
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Set up Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Reject generated and secret files
        working-directory: cliptown-rust-backend.rs
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.cache/|\.direnv/|\.env$|result$)' || true)
          test -z "$bad" || { printf 'forbidden tracked files:\n%s\n' "$bad"; exit 1; }
      - name: Verify dependency graph
        working-directory: cliptown-rust-backend.rs
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Enforce Postgres-only active dependency graph
        working-directory: cliptown-rust-backend.rs
        run: |
          for package in rsa sqlx-mysql sqlx-sqlite; do
            report=$(cargo tree --locked -e normal,build -i "$package" 2>&1 || true)
            if grep -Eq "^${package} v[0-9]" <<<"$report"; then
              printf '%s\n' "$report" >&2
              echo "forbidden package $package is reachable in the active Postgres dependency graph" >&2
              exit 1
            fi
          done
      - name: Validate app-vault security schema
        working-directory: cliptown-rust-backend.rs
        run: python3 scripts/check-security-schema.py
      - name: Check formatting
        working-directory: cliptown-rust-backend.rs
        run: cargo fmt --all --check
      - name: Run Clippy
        id: clippy
        continue-on-error: true
        working-directory: cliptown-rust-backend.rs
        run: cargo clippy --locked --all-targets --message-format=short -- -D warnings >clippy.txt 2>&1
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ matrix.toolchain }}
          path: cliptown-rust-backend.rs/clippy.txt
          if-no-files-found: error
      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        working-directory: cliptown-rust-backend.rs
        run: cat clippy.txt && exit 1
      - name: Run all-target tests, including headless MemeBank flow
        working-directory: cliptown-rust-backend.rs
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-targets -- --nocapture
      - name: Build release binary
        working-directory: cliptown-rust-backend.rs
        run: cargo build --locked --release
