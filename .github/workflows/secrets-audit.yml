name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified just
        env:
          JUST_VERSION: 1.51.0
          JUST_ARCHIVE_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$JUST_ARCHIVE_SHA256" "$RUNNER_TEMP/just.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          sudo install -m 0755 "$RUNNER_TEMP/just" /usr/local/bin/just
          just --version

      - name: Install checksum-verified ores-sops
        env:
          ORES_SOPS_REVISION: f152c11f76cc14b2af440b47c756b6c97c0aa36b
          ORES_SOPS_SHA256: be990d1d6e4df75b3e6bcc8f183018879554844db054997394bc0d31eed4c5ef
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/ores-sops" \
            "https://raw.githubusercontent.com/ORESoftware/ores-sops/${ORES_SOPS_REVISION}/ores-sops"
          printf '%s  %s\n' "$ORES_SOPS_SHA256" "$RUNNER_TEMP/ores-sops" \
            | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/ores-sops" /usr/local/bin/ores-sops
          ores-sops --version
          ores-sops ensure-dec
          test "$(stat -c '%a' env/dec)" = "700"

      - name: just env-check
        run: just env-check
