name: DEN-2259 one-shot normalization

on:
  push:
    branches:
      - agent/den-2259-activate-memebank-routes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2259-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out activation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2259-activate-memebank-routes
          path: workspace/cliptown-rust-backend.rs
          persist-credentials: true
          show-progress: false

      - name: Check out pinned interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cliptown/cliptown-interfaces
          ref: ef3d5f55719e56b1a6f11d2d6464c0976aa1863d
          path: workspace/cliptown-interfaces
          persist-credentials: false
          show-progress: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Generate lockfile and normalize Rust
        working-directory: workspace/cliptown-rust-backend.rs
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo clippy --fix --locked --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit normalized artifacts
        working-directory: workspace/cliptown-rust-backend.rs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src vendor/shared-auth-client
          if git diff --cached --quiet; then
            echo "No normalization changes were required."
            exit 0
          fi
          git commit -m "style(DEN-2259): normalize backend and lock dependency graph"
          git push origin HEAD:agent/den-2259-activate-memebank-routes
