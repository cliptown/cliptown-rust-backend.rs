[package]
org = "cliptown"
name = "cliptown-api"
version = "0.1.0"
description = "Rust API and synchronization backend for ClipTown"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-rust-backend.rs"

[install]
dir = ".vendor/.zed"

[dependencies]
"cliptown/cliptown-interfaces" = "^0.1.0"
# Keep this draft blocked until cliptown-monorepo#15 creates and publishes them.
"cliptown/cliptown-lib" = "^0.1.0"
"cliptown/cliptown-sync" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "node_modules/**", "target/**", "tmp/**", "**/*.log", ".vendor/.zed/**", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
